<svg xmlns="http://www.w3.org/2000/svg" viewBox="115 76 670 668" width="670" height="668" role="img" aria-label="Oversized technical hooded jacket floating in mid-air">
  <title>Synth Era technical hooded jacket</title>
  <desc>Placeholder product render: an empty oversized techwear parka, hood up, suspended in mid-air under cinematic studio lighting.</desc>

  <defs>
    <!-- ═══ CLOTH — key light upper-left, cool rim upper-right ═══ -->
    <linearGradient id="gBase" x1="0.04" y1="0.02" x2="0.94" y2="0.98">
      <stop offset="0"    stop-color="#5b636f"/><stop offset="0.18" stop-color="#3c424b"/>
      <stop offset="0.44" stop-color="#252a31"/><stop offset="0.72" stop-color="#14171b"/>
      <stop offset="1"    stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="gSlvL" x1="0" y1="0.04" x2="1.1" y2="0.92">
      <stop offset="0"    stop-color="#6b7684"/><stop offset="0.28" stop-color="#434b56"/>
      <stop offset="0.66" stop-color="#20252b"/><stop offset="1"    stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="gSlvR" x1="-0.15" y1="0.1" x2="1" y2="0.9">
      <stop offset="0"    stop-color="#191d23"/><stop offset="0.4"  stop-color="#101318"/>
      <stop offset="0.78" stop-color="#08090b"/><stop offset="1"    stop-color="#1a212c"/>
    </linearGradient>
    <linearGradient id="gHood" x1="0.06" y1="0.02" x2="0.94" y2="1">
      <stop offset="0"    stop-color="#7c8794"/><stop offset="0.24" stop-color="#49515c"/>
      <stop offset="0.56" stop-color="#282e35"/><stop offset="0.85" stop-color="#111419"/>
      <stop offset="1"    stop-color="#0a0c0f"/>
    </linearGradient>
    <linearGradient id="gCollar" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0"    stop-color="#4e5661"/><stop offset="0.42" stop-color="#262c33"/>
      <stop offset="1"    stop-color="#0a0c0e"/>
    </linearGradient>
    <linearGradient id="gBand" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0"    stop-color="#49515c"/><stop offset="0.42" stop-color="#242930"/>
      <stop offset="1"    stop-color="#090a0c"/>
    </linearGradient>

    <!-- the hood cavity: the garment is empty -->
    <linearGradient id="gCave" x1="0.3" y1="0" x2="0.75" y2="1">
      <stop offset="0"    stop-color="#000000"/><stop offset="0.45" stop-color="#06070a"/>
      <stop offset="0.82" stop-color="#12161c"/><stop offset="1"    stop-color="#1b212a"/>
    </linearGradient>

    <linearGradient id="gRim" x1="0.42" y1="0.05" x2="1.02" y2="0.95">
      <stop offset="0" stop-color="#a8bdd8" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#a8bdd8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#dce9fc" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gKey" x1="-0.02" y1="0" x2="0.76" y2="0.95">
      <stop offset="0" stop-color="#f8fbff" stop-opacity="0.85"/>
      <stop offset="0.22" stop-color="#cfd9e6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#cfd9e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gMetal" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f2f6fa"/><stop offset="0.28" stop-color="#9ca5b1"/>
      <stop offset="0.6" stop-color="#424851"/><stop offset="0.84" stop-color="#7b838e"/>
      <stop offset="1" stop-color="#272c32"/>
    </linearGradient>

    <radialGradient id="gSpec"><stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gOcc"> <stop offset="0" stop-color="#000000" stop-opacity="0.92"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>

    <filter id="fS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="fM" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="fL" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="36"/></filter>

    <!-- ═══ ONE CONTINUOUS SILHOUETTE ═══
         hood → shoulder → sleeve outer → cuff → sleeve inner → armpit →
         body side → hem, and back up the other side. The arms hang clear
         of the torso, so the armpit wedges read as real negative space. -->
    <path id="sil" d="M 450,96
      C 534,96 590,182 584,300
      C 616,304 656,300 688,318
      C 716,340 738,378 750,424
      C 758,490 764,556 764,612
      C 765,632 759,646 746,652
      C 720,664 692,660 678,648
      C 682,570 676,486 654,420
      C 642,388 630,372 616,362
      C 630,440 636,560 634,688
      C 634,706 626,716 612,718
      C 520,726 380,726 288,718
      C 274,716 266,706 266,688
      C 264,560 270,440 284,362
      C 270,372 258,388 246,420
      C 228,486 224,570 222,648
      C 208,660 180,664 154,652
      C 141,646 135,632 136,612
      C 136,556 142,490 156,424
      C 168,378 184,340 212,318
      C 244,300 284,304 316,300
      C 310,182 366,96 450,96 Z"/>
    <clipPath id="cAll"><use href="#sil"/></clipPath>

    <!-- region clips so bands and quilting stay on their own panel -->
    <clipPath id="cBody"><path d="M 300,236 C 276,300 272,346 284,366 C 266,500 264,700 264,790 L 636,790 C 636,700 634,500 616,366 C 628,346 624,300 600,236 Z"/></clipPath>
    <clipPath id="cSlvL"><path d="M 300,236 C 276,300 272,346 284,366 C 262,500 256,700 256,790 L 40,790 L 40,236 Z"/></clipPath>
    <clipPath id="cSlvR"><path d="M 600,236 C 624,300 628,346 616,366 C 638,500 644,700 644,790 L 860,790 L 860,236 Z"/></clipPath>
    <clipPath id="cHood"><path d="M 316,300 C 310,182 366,96 450,96 C 534,96 590,182 584,300 C 550,326 350,326 316,300 Z"/></clipPath>
  </defs>

  <!-- ambient bounce, so the garment separates from a black page -->
  <ellipse cx="450" cy="420" rx="248" ry="278" fill="#7e8ea8" opacity="0.06" filter="url(#fL)"/>

  <!-- ══════════════════ GARMENT ══════════════════ -->
  <use href="#sil" fill="url(#gBase)"/>

  <g clip-path="url(#cAll)">

    <!-- ───────── RIGHT SLEEVE — shadow side ───────── -->
    <g clip-path="url(#cSlvR)">
      <rect x="580" y="200" width="300" height="620" fill="url(#gSlvR)"/>
      <g fill="none" stroke-linecap="round">
        <path d="M 630,430 Q 704,446 800,432" stroke="#000" stroke-opacity="0.5" stroke-width="2.4"/>
        <path d="M 630,425 Q 704,441 800,427" stroke="#fff" stroke-opacity="0.045" stroke-width="1.3"/>
        <path d="M 646,510 Q 720,526 812,512" stroke="#000" stroke-opacity="0.5" stroke-width="2.4"/>
        <path d="M 646,505 Q 720,521 812,507" stroke="#fff" stroke-opacity="0.04" stroke-width="1.3"/>
        <path d="M 658,590 Q 732,606 820,592" stroke="#000" stroke-opacity="0.5" stroke-width="2.4"/>
        <path d="M 658,585 Q 732,601 820,587" stroke="#fff" stroke-opacity="0.035" stroke-width="1.3"/>
      </g>
      <rect x="640" y="606" width="200" height="120" fill="url(#gBand)" opacity="0.9"/>
      <path d="M 646,610 Q 720,630 800,604" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="2.6"/>
      <path d="M 646,616 Q 720,636 800,610" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="1.3"/>
      <ellipse cx="628" cy="360" rx="56" ry="120" fill="url(#gOcc)"/>
    </g>

    <!-- ───────── LEFT SLEEVE — lit side ───────── -->
    <g clip-path="url(#cSlvL)">
      <rect x="20" y="200" width="300" height="620" fill="url(#gSlvL)"/>
      <ellipse cx="198" cy="410" rx="70" ry="110" fill="url(#gSpec)" filter="url(#fM)"/>
      <g fill="none" stroke-linecap="round">
        <path d="M 100,432 Q 196,448 270,430" stroke="#000" stroke-opacity="0.52" stroke-width="2.5"/>
        <path d="M 100,427 Q 196,443 270,425" stroke="#fff" stroke-opacity="0.1" stroke-width="1.4"/>
        <path d="M 92,512 Q 184,528 254,510" stroke="#000" stroke-opacity="0.52" stroke-width="2.5"/>
        <path d="M 92,507 Q 184,523 254,505" stroke="#fff" stroke-opacity="0.095" stroke-width="1.4"/>
        <path d="M 86,592 Q 172,608 242,590" stroke="#000" stroke-opacity="0.52" stroke-width="2.5"/>
        <path d="M 86,587 Q 172,603 242,585" stroke="#fff" stroke-opacity="0.085" stroke-width="1.4"/>
      </g>
      <path d="M 178,346 L 252,338" stroke="#000" stroke-opacity="0.55" stroke-width="2.6"/>
      <rect x="172" y="338" width="10" height="22" rx="3" fill="url(#gMetal)"/>
      <rect x="60" y="606" width="200" height="120" fill="url(#gBand)" opacity="0.9"/>
      <path d="M 100,604 Q 174,630 254,610" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="2.6"/>
      <path d="M 100,610 Q 174,636 254,616" fill="none" stroke="#fff" stroke-opacity="0.11" stroke-width="1.4"/>
      <ellipse cx="272" cy="360" rx="44" ry="120" fill="url(#gOcc)" opacity="0.7"/>
    </g>

    <!-- ───────── TORSO ───────── -->
    <g clip-path="url(#cBody)">
      <ellipse cx="352" cy="336" rx="112" ry="80" fill="url(#gSpec)" filter="url(#fM)"/>
      <ellipse cx="378" cy="524" rx="90" ry="150" fill="url(#gSpec)" opacity="0.5" filter="url(#fM)"/>
      <rect x="548" y="230" width="160" height="560" fill="#000" opacity="0.36" filter="url(#fM)"/>
      <rect x="240" y="648" width="440" height="160" fill="#000" opacity="0.42" filter="url(#fM)"/>

      <path d="M 268,420 Q 450,454 632,420" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="2.6"/>
      <path d="M 268,415 Q 450,449 632,415" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1.5"/>

      <g fill="none" stroke-linecap="round">
        <path d="M 260,500 Q 450,522 640,500" stroke="#000" stroke-opacity="0.48" stroke-width="2.5"/>
        <path d="M 260,495 Q 450,517 640,495" stroke="#fff" stroke-opacity="0.07" stroke-width="1.4"/>
        <path d="M 258,570 Q 450,592 642,570" stroke="#000" stroke-opacity="0.48" stroke-width="2.5"/>
        <path d="M 258,565 Q 450,587 642,565" stroke="#fff" stroke-opacity="0.065" stroke-width="1.4"/>
        <path d="M 256,640 Q 450,662 644,640" stroke="#000" stroke-opacity="0.48" stroke-width="2.5"/>
        <path d="M 256,635 Q 450,657 644,635" stroke="#fff" stroke-opacity="0.055" stroke-width="1.4"/>
      </g>

      <rect x="230" y="678" width="440" height="140" fill="url(#gBand)" opacity="0.7"/>
      <path d="M 240,678 Q 450,704 660,678" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="2.8"/>
      <path d="M 240,684 Q 450,710 660,684" fill="none" stroke="#fff" stroke-opacity="0.055" stroke-width="1.4"/>

      <path d="M 450,306 L 450,722" stroke="#000" stroke-opacity="0.78" stroke-width="4.2"/>
      <path d="M 445.6,306 L 445.6,722" stroke="#fff" stroke-opacity="0.095" stroke-width="1.8"/>
      <rect x="442.5" y="504" width="15" height="34" rx="4.5" fill="url(#gMetal)"/>
      <rect x="446" y="536" width="8" height="28" rx="3" fill="url(#gMetal)" opacity="0.8"/>

      <path d="M 488,388 L 604,380" stroke="#000" stroke-opacity="0.7" stroke-width="3.4"/>
      <path d="M 488,384 L 604,376" stroke="#fff" stroke-opacity="0.07" stroke-width="1.4"/>
      <rect x="484" y="384" width="11" height="26" rx="3.5" fill="url(#gMetal)"/>

      <path d="M 306,474 L 402,470" stroke="#000" stroke-opacity="0.6" stroke-width="3.2"/>
      <rect x="368" y="460" width="27" height="21" rx="4.5" fill="url(#gMetal)" opacity="0.9"/>
    </g>

    <!-- armhole seams -->
    <path d="M 308,248 C 284,300 274,344 284,366" fill="none" stroke="#000" stroke-opacity="0.62" stroke-width="3.2"/>
    <path d="M 311,250 C 287,302 277,346 287,368" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1.4"/>
    <path d="M 592,248 C 616,300 626,344 616,366" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="3.2"/>

    <!-- ───────── HOOD ─────────
         Worn up, and empty: the crown catches the key light, and the cavity
         underneath the brim falls away into darkness. No head, no face. -->
    <path d="M 316,300 C 310,182 366,96 450,96 C 534,96 590,182 584,300 C 550,326 350,326 316,300 Z" fill="url(#gHood)"/>
    <g clip-path="url(#cHood)">
      <ellipse cx="366" cy="168" rx="88" ry="84" fill="url(#gSpec)" filter="url(#fM)"/>
      <rect x="524" y="80" width="94" height="270" fill="#000" opacity="0.44" filter="url(#fM)"/>
      <path d="M 450,96 C 448,150 448,210 450,290" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="2"/>
    </g>

    <!-- the empty cavity beneath the brim -->
    <path d="M 340,252 C 382,224 518,224 560,252 C 554,298 516,322 450,322 C 384,322 346,298 340,252 Z" fill="url(#gCave)"/>
    <ellipse cx="450" cy="256" rx="112" ry="42" fill="#000" opacity="0.85" filter="url(#fM)"/>
    <!-- light spilling onto the lower-left of the cavity -->
    <path d="M 352,282 C 372,306 406,318 450,320" fill="none" stroke="#9aa8bb" stroke-opacity="0.2" stroke-width="6" filter="url(#fS)"/>

    <!-- padded brim: the front edge of the hood, catching a highlight -->
    <path d="M 338,256 C 382,228 518,228 562,256" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="7"/>
    <path d="M 336,250 C 380,222 520,222 564,250" fill="none" stroke="url(#gKey)" stroke-width="2.8" opacity="0.75" filter="url(#fS)"/>
    <path d="M 340,252 C 384,226 516,226 560,252" fill="none" stroke="#fff" stroke-opacity="0.055" stroke-width="1.6"/>

    <!-- ───────── COLLAR: hood fabric spilling onto the shoulders ───────── -->
    <path d="M 306,304 C 356,282 544,282 594,304 C 610,332 608,358 592,374 C 532,398 368,398 308,374 C 292,358 290,332 306,304 Z" fill="url(#gCollar)"/>
    <path d="M 306,304 C 356,282 544,282 594,304" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="3.6"/>
    <path d="M 308,310 C 358,288 542,288 592,310" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="1.9"/>
    <path d="M 308,374 C 368,398 532,398 592,374" fill="none" stroke="#000" stroke-opacity="0.62" stroke-width="3"/>

    <!-- shadow the hood and collar cast onto the chest -->
    <ellipse cx="450" cy="398" rx="190" ry="38" fill="url(#gOcc)"/>

    <!-- ───────── DRAWCORDS ───────── -->
    <path d="M 402,382 C 398,420 394,448 390,474" fill="none" stroke="#0d0f12" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M 400.6,382 C 396.6,420 392.6,448 388.6,474" fill="none" stroke="#8892a0" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="380" y="420" width="18" height="27" rx="6.5" fill="url(#gMetal)"/>
    <path d="M 502,382 C 506,418 510,444 514,466" fill="none" stroke="#0a0c0e" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M 500.6,382 C 504.6,418 508.6,444 512.6,466" fill="none" stroke="#8892a0" stroke-opacity="0.3" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="504" y="414" width="18" height="27" rx="6.5" fill="url(#gMetal)" opacity="0.78"/>
  </g>

  <!-- ══════════════════ CONTOUR LIGHT ══════════════════ -->
  <path d="M 450,96 C 534,96 590,182 584,300 C 616,304 656,300 688,318 C 716,340 738,378 750,424 C 758,490 764,556 764,612 C 765,632 759,646 746,652"
        fill="none" stroke="url(#gRim)" stroke-width="3.6" filter="url(#fS)"/>
  <path d="M 616,362 C 630,440 636,560 634,688 C 634,706 626,716 612,718 C 520,726 380,726 288,718"
        fill="none" stroke="url(#gRim)" stroke-width="2.4" opacity="0.45" filter="url(#fS)"/>
  <path d="M 450,96 C 366,96 310,182 316,300 C 284,304 244,300 212,318 C 184,340 168,378 156,424 C 142,490 136,556 136,612 C 135,632 141,646 154,652"
        fill="none" stroke="url(#gKey)" stroke-width="3.8" filter="url(#fS)"/>
  <path d="M 284,362 C 270,440 264,560 266,688" fill="none" stroke="url(#gKey)" stroke-width="2.6" opacity="0.7" filter="url(#fS)"/>
</svg>
