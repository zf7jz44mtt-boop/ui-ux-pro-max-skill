# Configuración del despliegue. Netlify no tiene que construir nada: el sitio
# es HTML, CSS y JS estáticos.
[build]
  publish = "."

# Los archivos de assets llevan su contenido en el nombre solo cuando cambian,
# así que se cachean un año; el HTML no, para que un cambio se vea al momento.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
