<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>De la Isla — kit de perfil</title>
<style>
@import url('assets/fonts.css');
:root{
  --sea-900:#07191F; --sea-800:#0B242D; --sea-700:#10333E;
  --gold:#D8A657; --gold-soft:#E8C68B; --teal:#2F8A87; --sand:#F3EADA; --paper:#FBF7EF;
  --display:'Playfair Display',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:#181818; padding:36px; display:flex; flex-wrap:wrap; gap:28px; align-items:flex-start; }

/* ---------- foto de perfil 1080 x 1080 ----------
   Instagram la recorta en círculo: todo lo que importa vive dentro del 70 %
   central del cuadro. */
.avatar{
  position:relative; width:1080px; height:1080px; overflow:hidden;
  display:grid; place-items:center; background:var(--sea-900);
}
.avatar--paper{ background:var(--paper); }
.avatar__glow{
  position:absolute; width:900px; height:900px; border-radius:50%;
  background:radial-gradient(circle, rgba(216,166,87,.30), rgba(216,166,87,0) 66%);
  right:-160px; bottom:-200px;
}
.avatar--paper .avatar__glow{ background:radial-gradient(circle, rgba(216,166,87,.34), rgba(216,166,87,0) 66%); }
.avatar__ring{
  position:absolute; inset:56px; border-radius:50%;
  border:5px solid rgba(216,166,87,.30);
}
.avatar--paper .avatar__ring{ border-color:rgba(7,25,31,.16); }
.avatar__mark{ position:relative; width:600px; height:600px; }
.avatar__mark svg{ width:100%; height:100%; display:block; }
.avatar__safe{
  position:absolute; inset:0; border-radius:50%;
  outline:2px dashed rgba(255,0,0,.55); display:none;   /* guía, no se exporta */
}

/* ---------- portadas de destacados 1080 x 1920 ---------- */
.cover{
  position:relative; width:1080px; height:1920px; overflow:hidden;
  background:var(--sea-900); display:grid; place-items:center;
}
.cover__glow{
  position:absolute; width:1000px; height:1000px; border-radius:50%;
  background:radial-gradient(circle, rgba(216,166,87,.22), rgba(216,166,87,0) 68%);
}
.cover__icon{
  /* Instagram recorta la portada a un círculo tomado del centro de la story:
     el icono tiene que llenar ese círculo, no quedarse en un punto. */
  position:relative; width:620px; height:620px; color:var(--gold);
  display:grid; place-items:center;
  border:9px solid rgba(216,166,87,.38); border-radius:50%;
  background:rgba(216,166,87,.05);
}
.cover__icon svg{ width:300px; height:300px; }
.cover__glyph{ font-family:var(--display); font-size:300px; line-height:1; color:var(--gold); }
.cover__label{
  position:absolute; bottom:210px; left:0; right:0; text-align:center;
  font-family:var(--mono); font-size:34px; letter-spacing:.24em; text-transform:uppercase;
  color:rgba(243,234,218,.6);
}
.cover__brand{
  position:absolute; top:190px; left:0; right:0; text-align:center;
  font-family:var(--display); font-size:44px; color:var(--sand);
}
.cover__brand i{ font-style:italic; color:var(--gold); }

body.preview .avatar, body.preview .cover{ transform:scale(.24); transform-origin:top left; }
</style>
</head>
<body>

<!-- foto de perfil principal -->
<section class="avatar" data-name="avatar-oscuro">
  <span class="avatar__glow"></span>
  <span class="avatar__ring"></span>
  <div class="avatar__mark">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="76" r="42" fill="#D8A657"/>
      <path d="M22 128q39-26 78 0t78 0" fill="none" stroke="#2F8A87" stroke-width="13" stroke-linecap="round"/>
      <path d="M22 160q39-26 78 0t78 0" fill="none" stroke="rgba(47,138,135,.55)" stroke-width="10" stroke-linecap="round"/>
    </svg>
  </div>
</section>

<!-- alternativa en papel -->
<section class="avatar avatar--paper" data-name="avatar-papel">
  <span class="avatar__glow"></span>
  <span class="avatar__ring"></span>
  <div class="avatar__mark">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="76" r="42" fill="#D8A657"/>
      <path d="M22 128q39-26 78 0t78 0" fill="none" stroke="#10333E" stroke-width="13" stroke-linecap="round"/>
      <path d="M22 160q39-26 78 0t78 0" fill="none" stroke="rgba(16,51,62,.5)" stroke-width="10" stroke-linecap="round"/>
    </svg>
  </div>
</section>

<!-- portadas de destacados -->
<section class="cover" data-name="destacado-casos">
  <span class="cover__glow"></span>
  <p class="cover__brand">De la <i>Isla</i></p>
  <div class="cover__icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 3.6 14.4 9l5.9.8-4.3 4.1 1 5.9-5-2.8-5 2.8 1-5.9L3.7 9.8 9.6 9z"/></svg>
  </div>
  <p class="cover__label">Casos</p>
</section>

<section class="cover" data-name="destacado-antes-despues">
  <span class="cover__glow"></span>
  <p class="cover__brand">De la <i>Isla</i></p>
  <div class="cover__icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 9h13l-3.4-3.4M20 15H7l3.4 3.4"/></svg>
  </div>
  <p class="cover__label">Antes / después</p>
</section>

<section class="cover" data-name="destacado-precios">
  <span class="cover__glow"></span>
  <p class="cover__brand">De la <i>Isla</i></p>
  <div class="cover__icon">
    <span class="cover__glyph">&euro;</span>
  </div>
  <p class="cover__label">Precios</p>
</section>

<section class="cover" data-name="destacado-la-isla">
  <span class="cover__glow"></span>
  <p class="cover__brand">De la <i>Isla</i></p>
  <div class="cover__icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="11" r="4"/><path d="M3 19h18M12 3v2M5 7l1.4 1.4M19 7l-1.4 1.4"/></svg>
  </div>
  <p class="cover__label">La isla</p>
</section>

</body>
</html>
